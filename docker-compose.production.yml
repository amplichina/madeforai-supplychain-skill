services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: madeforai
      POSTGRES_USER: madeforai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madeforai -d madeforai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PORT: 3000
      MCP_TRANSPORT: http
      MCP_DEV_MEMORY_STORE: "false"
      MCP_HTTP_AUTH_REQUIRED: "true"
      MCP_HTTP_API_KEY: ${MCP_HTTP_API_KEY:?Set MCP_HTTP_API_KEY}
      ENABLE_DEMO_ROUTES: "false"
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD}
      OPERATOR_SESSION_SECRET: ${OPERATOR_SESSION_SECRET:?Set OPERATOR_SESSION_SECRET}
      OPERATOR_COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "127.0.0.1:3000:3000"
    command: ["node", "dist/src/index.js", "--http"]

volumes:
  postgres-data:
