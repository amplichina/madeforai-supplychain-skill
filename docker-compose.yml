services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: madeforai
      POSTGRES_USER: madeforai
      POSTGRES_PASSWORD: madeforai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madeforai -d madeforai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://madeforai:madeforai@postgres:5432/madeforai
      PORT: 3000
      MCP_TRANSPORT: http
      MCP_HTTP_AUTH_REQUIRED: ${MCP_HTTP_AUTH_REQUIRED:-false}
      MCP_HTTP_API_KEY: ${MCP_HTTP_API_KEY:-}
      ENABLE_DEMO_ROUTES: ${ENABLE_DEMO_ROUTES:-true}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD before starting Docker}
      OPERATOR_SESSION_SECRET: ${OPERATOR_SESSION_SECRET:?Set OPERATOR_SESSION_SECRET before starting Docker}
      OPERATOR_COOKIE_SECURE: ${OPERATOR_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "3000:3000"
    command: ["node", "dist/src/index.js", "--http"]

volumes:
  postgres-data:
